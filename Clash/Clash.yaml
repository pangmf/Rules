port: 7890           # HTTP 代理端口
socks-port: 7891     # Socks 端口
redir-port: 7892     # Redir 端口
mixed-port: 7893     # 混合端口
allow-lan: true      # 允许局域网连接
bind-address: "*"    # 地址绑定
mode: rule           # 规则模式
log-level: info      # 日志级别
ipv6: false          # IPV6开关
external-controller: 127.0.0.1:9090

dns:
  enable: true       # 不使用系统 DNS
  ipv6: false        # 关闭 IPV6
  listen: 0.0.0.0:53 # dns 监听
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.xboxlive.com
    - msftconnecttest.com
    - xbox.*.microsoft.com
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
  nameserver:        # 默认 DNS 服务
    - 223.5.5.5
    - 119.29.29.29
  fallback:          # 国外 DNS 服务器
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - https://dns.alidns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
#========= 建立锚点 =========#

# 策略组引用
pr:   &a3 {type: select,   proxies: [♻️ 自动选择, 🚀 手动切换, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇨🇳 台湾节点, 🇸🇬 狮城节点, DIRECT] }
p:    &a1 {type: http,     interval: 86400,  health-check: {enable: true, url: http://www.gstatic.com/generate_204, interval: 1800} }
auto: &a4 {type: url-test, lazy: true,  url: http://www.gstatic.com/generate_204, interval: 900, use: [Sub1,Sub2,Sub3] }
use:  &a2 {type: select,   use: [Sub1,Sub2,Sub3] }
c:    &a6 {type: http,     behavior: classical, interval: 86400}
d:    &a5 {type: http,     behavior: domain,    interval: 86400}
i:    &a7 {type: http,     behavior: ipcidr,    interval: 86400}

# https://sub.dler.io/
proxy-providers:
  Sub1:
    <<: *a1
    url: https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Clash/jsyjd.yaml
    path: ./proxy_providers/JSY.yaml
  Sub2:
    <<: *a1
    url: https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Clash/ysyjd.yaml
    path: ./proxy_providers/YSY.yaml
  Sub3:
    <<: *a1
    url: https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Clash/Kittyjd.yaml
    path: ./proxy_providers/KN.yaml
    # URL后面填写格式1: 直接填写你的机场Clash订阅[推荐此种方式，避免订阅泄露
    # URL后面填写格式2[集合订阅]：https://api.nexconvert.com/sub?target=clash&url=请手动填入你的订阅(多机场订阅用|分割即可)&emoji=true&list=true&new_name=true&udp=false

proxies: null
proxy-groups:
#分流分组
  - {name: 🚀 手动切换, <<: *a2}
  - {name: 🌏 全球加速, <<: *a3}
  - {name: 🍎 苹果服务, <<: *a3}
  - {name: 📺 哔哩哔哩, type: select, proxies: [DIRECT, 🇭🇰 香港节点, 🇨🇳 台湾节点]}
  - {name: 🎬 国际媒体, <<: *a3}
  - {name: 📟 电报消息, <<: *a3}
  - {name: 🎮 游戏平台, <<: *a3}
  - {name: 🎬 Spotify,  type: select, proxies: [🇭🇰 香港节点]}
  - {name: 🤖 OpenAi,   type: select, proxies: [🇺🇲 美国节点]}
  - {name: 🆎 AdBlock, type: select, proxies: [REJECT]}
  - {name: 🐟 兜底分流, <<: *a3}

  
#节点分组
  - {name: ♻️ 自动选择, <<: *a4, filter: ^(.(?!(网易|Music|地址|机场|重置|到期|套餐|返利|流量|站内|导航|.com|Game)))*$}
  - {name: 🇭🇰 香港节点, <<: *a4, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美|网易|Music|Game|地址|机场|重置|到期|套餐|返利|流量|导航|专用)).)*$"           }                 # a4更改为a2，即为手动选择
  - {name: 🇯🇵 日本节点, <<: *a4, filter: "(?=.*(日|东京|JP|(?i)Japan))^((?!(港|台|韩|新|美|网易|Music|Game|地址|机场|重置|到期|套餐|返利|流量|导航|专用)).)*$"     }                 # a4更改为a2，即为手动选择     
  - {name: 🇨🇳 台湾节点, <<: *a4, filter: "(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美|网易|Music|Game|地址|机场|重置|到期|套餐|返利|流量|导航|专用)).)*$"      }                    # a4更改为a2，即为手动选择
  - {name: 🇺🇲 美国节点, <<: *a4, filter: "(?=.*(美|纽约|洛杉矶|US|(?i)States|American))^((?!(港|台|日|韩|新|网易|Music|Game|地址|机场|重置|到期|套餐|返利|流量|导航|专用)).)*$"}     # a4更改为a2，即为手动选择
  - {name: 🇸🇬 狮城节点, <<: *a4, filter: "(?=.*(新|狮|獅|SG|(?i)Singapore))^((?!(港|台|日|韩|美|网易|Music|Game|地址|机场|重置|到期|套餐|返利|流量|导航|专用)).)*$"    }              # a4更改为a2，即为手动选择
  

