# ==================== 分流规则 ====================
# 顺序忠实还原原配置：广告 → Apple → 微信 → AI → 苹果智能 → 媒体 → 支付 → 全球 → 国内
# 唯一调整：局域网规则提到最前。原配置里 LAN 在 ChinaMax 之后，
# 私有网段会先落到 MATCH,Final 走代理，导致局域网设备无法访问。
rules:
  # 局域网（顺序修正，见上）
  - RULE-SET,lan,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT

  # 原配置 rules 顺序
  - RULE-SET,ads,ADs,no-resolve
  - RULE-SET,apple,Apple,no-resolve
  - RULE-SET,apple_domain,Apple,no-resolve
  - RULE-SET,wechat,DIRECT,no-resolve
  - RULE-SET,ai,AI,no-resolve
  - RULE-SET,apple_intelligence,AppleAI,no-resolve
  - RULE-SET,tiktok,TikTok,no-resolve
  - RULE-SET,netflix,Netflix,no-resolve
  - RULE-SET,google_voice,GoogleVoice,no-resolve
