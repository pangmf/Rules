####################################################################
#  Clash 通用配置（iOS / Android / Windows 客户端通用，Mihomo 内核）
#
#  源文件：https://github.com/pangmf/Rules/blob/master/Egern/Egern.yaml
#  转换说明：Egern 配置 → Clash 配置的逐项映射，见文末「转换对照表」
#
#  适用客户端：
#    iOS      Clash / ClashX Pro / Stash（Mihomo 模式）/ Shadowrocket（需转）
#    Android  Clash Meta for Android / FlClash
#    Windows  Clash Verge / Clash Verge Rev / Mihomo Party
#
####################################################################

# ==================== 基础设置 ====================
mixed-port: 7890             
allow-lan: false              
bind-address: "*"
mode: rule
log-level: info
ipv6: true                  
external-controller: 127.0.0.1:9090
secret: ""
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# 域名嗅探：还原 fake-ip 下被隐藏的真实域名
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== DNS ====================
# 原配置为三段式 DNS（DIRECT-DNS / PROXY-DNS / GLOBAL-DNS）+ 按规则集分流。
# Clash 不支持"按规则集指定 DNS"，此处用 nameserver / fallback / fallback-filter 等效实现：
#   国内域名 → nameserver（原 DIRECT-DNS）
#   国外域名 → fallback（原 GLOBAL-DNS）
#   节点域名 → proxy-server-nameserver（原 PROXY-DNS）
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "stun.*.*"
    - "stun.*.*.*"
    - "*.mcdn.bilivideo.cn"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:                 # 原 DIRECT-DNS
    - 223.5.5.5
    - 119.29.29.29
    - 180.76.76.76
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:    # 原 PROXY-DNS，解析机场节点域名
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:                   # 原 GLOBAL-DNS
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    # 原 dns.forward 里走 GLOBAL-DNS 的规则集，用域名列表近似代替
    domain:
      - "+.telegram.org"
      - "+.t.me"
      - "+.twitter.com"
      - "+.x.com"
      - "+.twimg.com"
      - "+.github.com"
      - "+.githubusercontent.com"
      - "+.githubassets.com"

# ==================== 节点来源 ====================
# 原配置 proxies 为空，4 个 external 策略组即 4 条订阅
proxy-providers:
  CrossWall:
    type: http
    url: "https://162.19.79.201/s/e7e47a5f81fdd9be8648cc986703f40a"
    path: ./providers/crosswall.yaml
    interval: 86400
    filter: '.*[A-Z]A.*'
    exclude-filter: '(?i)(HA1)'
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      lazy: true

  Kitty:
    type: http
    url: "https://m1.tohno-0.top/oosaka/b5e1573fa71c38b1808cd8c19c1a9960"
    path: ./providers/kitty.yaml
    interval: 2592000
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      lazy: true

  橘色云:
    type: http
    url: "https://makabaka.jusesub.com/makabaka/c723c73198bb154fc5700ceed587efea"
    path: ./providers/juse.yaml
    interval: 2592000
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      lazy: true

  夜煞云:
    type: http
    url: "https://45.137.180.216/L?ZG93bmxvYWRDb25maWcuanMvOTE1ZjY4OGNkODY3Mjg3M2RkNzBhMmNiNjUyNTI3NDQ/dGltZXN0YW1wPTEyMjY5"
    path: ./providers/yesha.yaml
    interval: 2592000
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      lazy: true

# ==================== 策略组 ====================
proxy-groups:
  # ---------- 原「手动选择」：select，包含 4 条订阅全部节点 ----------
  # 原配置用正向前瞻正则过滤垃圾节点，Clash 的 RE2 不支持 (?!...)，改用 exclude-filter 等效实现
  - name: "手动选择"
    type: select
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    exclude-filter: '(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|发布|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|好友|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Game|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)'
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

  # ---------- 原「自动选择」：auto_test → url-test ----------
  - name: "自动选择"
    type: url-test
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 10
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SSID_1.png

  # ---------- 地区分组：原 smart → url-test + filter ----------
  - name: "香港节点"
    type: url-test
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    filter: '(?i)(🇭🇰|HK|HKG|Hong\s*Kong|香港)'
    proxies: [DIRECT]
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 100
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

  - name: "台湾节点"
    type: url-test
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    filter: '(?i)(🇹🇼|TW|TPE|Taiwan|台湾|台灣)'
    proxies: [DIRECT]
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 100
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png

  - name: "美国节点"
    type: url-test
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    filter: '(?i)(🇺🇸|USA|LAX|SJC|SEA|NYC|JFK|EWR|DAL|ORD|ATL|SFO|United States|美国|美國)'
    proxies: [DIRECT]
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 100
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

  - name: "日本节点"
    type: url-test
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    filter: '(?i)(🇯🇵|JP|TYO|OSA|NRT|HND|KIX|Japan|日本|东京|大阪)'
    proxies: [DIRECT]
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 100
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

  - name: "新加坡节点"
    type: url-test
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    filter: '(?i)(🇸🇬|SG|SIN|Singapore|新加坡|狮城)'
    proxies: [DIRECT]
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 100
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

  - name: "韩国节点"
    type: url-test
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    filter: '(?i)(🇰🇷|KR|ICN|SEL|Korea|Seoul|韩国|韓國)'
    proxies: [DIRECT]
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 100
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png

  # ---------- 原「欧洲节点」：select + filter ----------
  - name: "欧洲节点"
    type: select
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    proxies: [DIRECT]
    filter: '(?i)(🇪🇺|UK|DE|FR|NL|CH|GE|PT|SE|NO|DK|LON|FRA|AMS|PAR|欧洲|欧盟|英国|德国|法国)'
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/EU.png

  # ---------- 原「其他节点」：select + 反向过滤 ----------
  - name: "其他节点"
    type: select
    use: [CrossWall, Kitty, 橘色云, 夜煞云]
    proxies: [DIRECT]
    exclude-filter: '(?i)(🇭🇰|HK|HKG|香港|🇹🇼|TW|TPE|台湾|台灣|🇯🇵|JP|TYO|OSA|NRT|HND|日本|🇸🇬|SG|SIN|新加坡|🇺🇸|USA|LAX|SFO|NYC|JFK|United States|美国|美國|🇰🇷|KR|ICN|SEL|韩国|韓國|🇪🇺|UK|GB|DE|FR|NL|CH|ES|IT|GE|欧洲|欧盟|英国|德国|法国|官网|Music|Game|地址|机场|重置|到期|套餐|发布|流量|导航|专用)'
