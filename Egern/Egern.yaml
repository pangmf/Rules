# MITM 配置
mitm:
  # 是否启用
  enabled: true
  # CA 证书文件路径
  ca_p12: ""
  # CA 证书密码
  ca_passphrase: ""
  # mitm 的主机名列表
  hostnames:
    includes:
    - '*.googlevideo.com'
    - '*.g.cn'
    - '*.google.cn'
    - '*.google.com.hk'
    - '*.google.co.jp'
    excludes:
    - consumer.fcbox.com
    - '*huami.com'
    - '*amemv.com'
    - '*snssdk.com'
    - www.google.com
# HTTP 抓包配置列表
http_captures:
# 匹配的主机名

