# 脚本配置列表
scriptings:
  - generic:
      name: 油价查询小组件
      script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Oil_Widget.JS
      env:
        region: zhejiang/taizhou
      update_interval: 2592000
  - generic:
      name: 彩票开奖小组件
      script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Lottery-Widget.JS
      update_interval: 2592000
  - generic:
      name: 网络诊断雷达
      script_url: https://raw.githubusercontent.com/lylywayr/NetWork-Module/refs/heads/main/Egern/%E7%BD%91%E7%BB%9C%E8%AF%8A%E6%96%AD%E9%9B%B7%E8%BE%BE/%E7%BD%91%E7%BB%9C%E8%AF%8A%E6%96%AD%E9%9B%B7%E8%BE%BE.js
      env:
        XY: ' '
        AI: AI
      update_interval: 2592000
  # 定时任务脚本
  - schedule:
      # 脚本名称
      name: 极氪自动签到
      # 定时任务表达式
      cron: 30 6 * * *
      # 脚本 URL。可以是本地路径或远程代理链接
      script_url: https://raw.githubusercontent.com/wf021325/qx/master/task/zeekr.js
      # 更新间隔。默认间隔 1 天
      update_interval: 2592000
      # 超时时间
      timeout: 30
      # 脚本禁用
      disabled: true
  - schedule:
      name: WPS每日签到
      cron: 0 10 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.js
      update_interval: 2592000
      timeout: 120
      disabled: true
  - schedule:
      name: 小米商城签到
      cron: 15 8 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/mishop/mishop.js
      update_interval: 2592000
      timeout: 120
      disabled: true
  - schedule:
      name: 小米抽奖签到
      cron: 30 8 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js
      update_interval: 2592000
      timeout: 120
      disabled: true
  - schedule:
      name: QQ音乐每日任务
      cron: 0 30 7 * * *
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
      update_interval: 2592000
      timeout: 120
      disabled: true
  - schedule:
