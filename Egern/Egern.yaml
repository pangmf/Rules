  # 默认策略
  - default:
      # 使用的策略
      policy: Final
      
# URL 重写列表
url_rewrites:
# ======= Google搜索重写  ======= #
  # 匹配的 URL
  - match: "/^https?:\/\/(www.)?g.cn/i"
    # 重定向的位置
    location: https://www.google.com
    # 重定向的状态码
    status_code: 302
  - match: "/^https?:\/\/(www.)?(g|google)\.cn/i"
    location: https://www.google.com
    status_code: 302
  - match: "/^https?:\/\/(www\.)?google\.com\.hk/i"
    location: https://www.google.com
    status_code: 302
  - match: "/^https?:\/\/(www\.)?google\.co\.jp/i"
    location: https://www.google.com
    status_code: 302

# 脚本配置列表
scriptings:
  - generic:
    name: 油价查询小组件
    script_url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Oil_Widget.JS
  # 定时任务脚本
  - schedule:
      # 脚本名称
