name: 岁时黄历 (Almanac) 小组件
description: • 尺寸支持：适配小号（农历信息全量）、中号（黄历基础布局）、大号（增加节气展示及换行处理）。/n • 农历引擎：本地计算干支、生肖、农历日期及二十四节气（完美修复跨时区及当月首节气匹配漏洞）。/n • 远程数据：请求 openApiData 获取宜忌、冲煞及运势评分，网络异常时支持本地容错降级。/n • 顶部角标：支持「星座」与「周次」双模式切换。星座模式可附带教学周进度，周次模式纯净显示年/周次及年内天数。/n • 农历引擎：本地计算干支、生肖、农历日期及二十四节气（完美修复跨时区及当月首节气匹配
author: "@pangmf"
homepage: "https://github.com/pangmf"
icon: "https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/DeePlayer.png"
env_schema:
  ASTRO_OR_WEEK:
    name: 星座与周次
    description: 支持「星座」与「周次」双模式切换 astro / week。
    default_value: 'astro'
  SHOW_TEACHING_WEEK:
    name: 显示教学周
    description: 星座模式可附带教学周进度，周次模式纯净显示年/周次及年内天数 true / false
    default_value: 'false'
  TEACHING_WEEK_START:
    name: 教学周开始时间
    description: 教学周开始时间，时间格式为：2026-09-01
    default_value: '2026-09-01'
scriptings:
- generic:
    name: 岁时黄历
    script_url: https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Egern/Widget/Almanac.js
    timeout: 30
widgets:
- name: 岁时黄历
  script_name: 岁时黄历
