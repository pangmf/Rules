name: 实时油价小组件
description: 92/95/98/柴油实时油价、调价倒计时进度条、加满一箱花费与本轮涨跌影响、临近调价预测（基于 jnlaoshu GasPrice 改版）
author: "@pangmf"
homepage: "https://github.com/pangmf"
icon: "https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/PharosPro.png"
env_schema:
  PROVINCE:
    name: 省份
    description: 省份编码或名称，如 33 或 浙江
    default_value: '33'
  CITY:
    name: 城市
    description: 显示用城市名，多区域省份也用来匹配地区
    default_value: '杭州'
  MY_FUEL:
    name: 常加油号
    description: 92 / 95 / 98 / 柴油，用于高亮和计算加满花费
    default_value: '92'
  TANK_L:
    name: 油箱容量（升）
    description: 用来计算加满一箱的花费
    default_value: '50'
  TITLE:
    name: 标题
    description: 留空显示「城市+油价」
    default_value: ''
  AREA_INDEX:
    name: 地区索引
    description: 可选，多区域省份手动指定
    default_value: ''
  OFFSET_SCALE:
    name: 涨跌幅系数
    description: 默认 1
    default_value: '1'
  STYLE:
    name: 显示风格
    description: |
      - glass:   透明玻璃效果
      - classic: 原生纯色背景
    default_value: 'glass'
scriptings:
- generic:
    name: 今日油价
    script_url: https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Egern/Widget/Oil_Widget.js
    timeout: 30
widgets:
- name: 今日油价
  script_name: 今日油价
