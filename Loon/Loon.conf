[Remote Filter]
# 节点过滤器 — 根据机场节点名称调整正则
# 排除广告/促销/测速等无用节点
ALL = NameRegex, FilterKey = "^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|发布|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Game|Channel|Author|Traffic)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$"
HK = NameRegex, FilterKey = "(?i)(🇭🇰|HK|HKG|Hong\s*Kong|香港)"
TW = NameRegex, FilterKey = "(?i)(🇹🇼|TW|TPE|Taiwan|台湾|台灣)"
JP = NameRegex, FilterKey = "(?i)(🇯🇵|JP|TYO|OSA|NRT|HND|KIX|Japan|日本|东京|大阪)"
SG = NameRegex, FilterKey = "(?i)(🇸🇬|SG|SIN|Singapore|新加坡|狮城)"
US = NameRegex, FilterKey = "(?i)(🇺🇸|USA|LAX|SJC|SEA|NYC|JFK|EWR|DAL|ORD|ATL|SFO|United States|美国|美國)"
KR = NameRegex, FilterKey = "(?i)(🇰🇷|KR|ICN|SEL|Korea|Seoul|韩国|韓國)"
EU = NameRegex, FilterKey = "(?i)(🇪🇺|UK|GB|DE|FR|NL|CH|GE|PT|SE|NO|DK|LON|FRA|AMS|PAR|欧洲|欧盟|英国|德国|法国)"
# 未归类节点
Other = NameRegex, FilterKey = "(?i)^(?!.*(🇭🇰|HK|HKG|香港|🇹🇼|TW|TPE|台湾|台灣|🇯🇵|JP|TYO|OSA|NRT|HND|日本|🇸🇬|SG|SIN|新加坡|🇺🇸|USA|LAX|SFO|NYC|JFK|United States|美国|美國|🇰🇷|KR|ICN|SEL|韩国|韓國|🇪🇺|UK|GB|DE|FR|NL|CH|ES|IT|GE|欧洲|欧盟|英国|德国|法国)).+"

