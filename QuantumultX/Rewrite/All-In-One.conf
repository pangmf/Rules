# ============================================================
# QuantumultX 综合配置 · 由 Loon/Plugin 目录转换合并
# 来源仓库：https://github.com/pangmf/Rules/tree/master/Loon/Plugin
# 生成时间：2026-10-21
#
# 用法：QuantumultX → 设置 → 重写 → 引用，填入本文件的远程地址；
#       或把 [rewrite_local] / [mitm] 两段内容手动并入主配置。
# 注意：Cookie.conf 中的规则在上游默认关闭，此处保持注释状态。
# ============================================================

[rewrite_local]

# ---- CADReader.conf ----
^https?:\/\/cad\.everdrawing\.com\/(mobile\/verifyVip|.*authorize\/(verify-vip|query)) url script-request-body https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/CADReader.js
# ---- CamScanner.conf ----
^https:\/\/(api|api-cs)\.intsig\.net\/purchase\/cs\/query_property\? url script-response-body https://raw.githubusercontent.com/NobyDa/Script/master/Surge/JS/CamScanner.js
# ---- dbss.conf ----
^https?:\/\/api\.revenuecat\.com\/v1\/receipts url script-response-body https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/dbss.js
# ---- mgtv.conf ----
^https?:\/\/mobile-stream\.api\.mgtv\.com\/v1\/video\/source url script-request-body https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/mgtv_vip.js
# ---- zeekr.conf ----
^https:\/\/api-gw-toc\.zeekrlife\.com\/zeekrlife-app-user\/v\d\/user\/info\/query$ url script-response-body https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js
# ---- wps.conf ----
^https:\/\/personal-act\.wps\.cn\/activity-rubik\/activity\/page_info url script-request-header https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.cookie.js
# ---- PingMe&WeTalk.conf ----
^https:\/\/api\.wetalkapp\.com\/app\/(?:queryBalanceAndBonus|checkIn|videoBonus) url script-request-header https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/WeTalk.js
^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/PingMe.js


[mitm]

hostname = %APPEND% cad.everdrawing.com, *.camscanner.com, ap*.intsig.net, api.revenuecat.com, mobile-stream.api.mgtv.com, api-gw-toc.zeekrlife.com, personal-act.wps.cn, api.wetalkapp.com, api.pingmeapp.net
