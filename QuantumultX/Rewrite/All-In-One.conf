[mitm]

hostname = %APPEND% cad.everdrawing.com, *.camscanner.com, ap*.intsig.net, api.revenuecat.com, mobile-stream.api.mgtv.com, api-gw-toc.zeekrlife.com, personal-act.wps.cn, api.wetalkapp.com, api.pingmeapp.net, google.cn, *.google.cn, google.co.jp, *.google.co.jp, google.co.uk, *.google.co.uk, google.ca, *.google.ca, google.com.au, *.google.com.au, google.de, *.google.de, google.fr, *.google.fr, google.it, *.google.it, google.es, *.google.es, google.in, *.google.in, google.co.kr, *.google.co.kr, google.com.br, *.google.com.br, google.com.mx, *.google.com.mx, google.com.sg, *.google.com.sg, google.com.hk, *.google.com.hk, google.com.tw, *.google.com.tw, google.com.tr, *.google.com.tr, google.ru, *.google.ru
