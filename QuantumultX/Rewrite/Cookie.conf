# ============================================================
# Cookie 获取合集 · 多个 App 签到脚本的账号抓取
# 来源：pangmf/Rules → Loon/Plugin/Cookie.lpx（master 分支）
# 作者：pangmf
#
# 重要：原 Loon 配置用 [Argument] 定义了 9 个 switch，全部默认关闭（false），
#       QuantumultX 没有等价的开关机制，所以下面的规则全部以 # 注释形式保留。
#       请按需取消对应行的注释，不要一次性全开（会对 9 个 App 同时解密流量）。
#
# 转换规则：
#   http-request  + requires-body=true  → script-request-body
#   http-request  + requires-body=false → script-request-header
#   http-response + requires-body=true  → script-response-body
# ============================================================

[rewrite_local]

# 1) 极氪汽车（进任意页面触发）
 ^https:\/\/api-gw-toc\.zeekrlife\.com\/zeekrlife-app-user\/v\d\/user\/info\/query$ url script-response-body https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js

# 2) 小米商城（进米金签到页触发）
 ^https:\/\/shop-api\.retail\.mi\.com\/mtop\/mf\/act\/infinite\/(do|done) url script-request-header https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/mishop/mishop.cookie.js

# 3) 小米抽奖（进「狂欢礼」活动页触发）
 ^https:\/\/shop-api\.retail\.mi\.com\/mtop\/navi\/venue\/batch url script-request-body https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/milottery/milottery.js

# 4) QQ音乐（进绿钻会员中心触发）
 ^https:\/\/u6\.y\.qq\.com\/cgi-bin\/musics\.fcg\?.*(EveryDaySignLvzScore|GetSignInSummary) url script-request-body https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js

# 5) WPS（进任务中心/福利中心触发）
 ^https:\/\/personal-act\.wps\.cn\/activity-rubik\/activity\/page_info url script-request-header https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.cookie.js

# 6) 扫描全能王（任意页停留几秒触发）
 ^https:\/\/api-cs\.intsig\.net\/user\/cs\/get_user_attribute url script-request-header https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/camscanner/camscanner.cookie.js

# 7) 追觅（进「商城」或「我的」页触发）
 ^https:\/\/cn-wxmall\.dreame\.tech\/main\/my\/info url script-request-body https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/dreame/dreame.js

# 8) WeTalk（停留 1 秒触发）
 ^https:\/\/api\.wetalkapp\.com\/app\/(?:queryBalanceAndBonus|checkIn|videoBonus) url script-request-header https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/WeTalk.js

# 9) PingMe（停留 1 秒触发）
 ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/PingMe.js

[mitm]

hostname = %APPEND% api-gw-toc.zeekrlife.com, app.mixcapp.com, shop-api.retail.mi.com, personal-act.wps.cn, api-cs.intsig.net, cn-wxmall.dreame.tech, cn-yx-wxmall.dreame.tech, api.wetalkapp.com, api.pingmeapp.net
