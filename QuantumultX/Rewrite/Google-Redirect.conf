# ============================================================
# Google 区域搜索重定向 · 各地区域名 302 到 google.com
# 来源：pangmf/Rules → Loon/Plugin/Google-Redirect.lpx（master 分支）
# 作者：pangmf
# 转换：Loon [Rewrite]「<regex> <target> 302」→ QX「<regex> url 302 <target>」
# 说明：QX 的 URL 重写同样依赖 MITM，下方 hostname 已包含全部源域名
# ============================================================

[rewrite_local]

# Google.cn
^https?:\/\/(?:www\.)?google\.cn\/(.*)$ url 302 https://www.google.com/$1

# Google.co.jp
^https?:\/\/(?:www\.)?google\.co\.jp\/(.*)$ url 302 https://www.google.com/$1

# Google.co.uk
^https?:\/\/(?:www\.)?google\.co\.uk\/(.*)$ url 302 https://www.google.com/$1

# Google.ca
^https?:\/\/(?:www\.)?google\.ca\/(.*)$ url 302 https://www.google.com/$1

# Google.com.au
^https?:\/\/(?:www\.)?google\.com\.au\/(.*)$ url 302 https://www.google.com/$1

# Google.de
^https?:\/\/(?:www\.)?google\.de\/(.*)$ url 302 https://www.google.com/$1

# Google.fr
^https?:\/\/(?:www\.)?google\.fr\/(.*)$ url 302 https://www.google.com/$1

# Google.it
^https?:\/\/(?:www\.)?google\.it\/(.*)$ url 302 https://www.google.com/$1

# Google.es
^https?:\/\/(?:www\.)?google\.es\/(.*)$ url 302 https://www.google.com/$1

# Google.in
^https?:\/\/(?:www\.)?google\.in\/(.*)$ url 302 https://www.google.com/$1

# Google.co.kr
^https?:\/\/(?:www\.)?google\.co\.kr\/(.*)$ url 302 https://www.google.com/$1

# Google.com.br
^https?:\/\/(?:www\.)?google\.com\.br\/(.*)$ url 302 https://www.google.com/$1

# Google.com.mx
^https?:\/\/(?:www\.)?google\.com\.mx\/(.*)$ url 302 https://www.google.com/$1

# Google.com.sg
^https?:\/\/(?:www\.)?google\.com\.sg\/(.*)$ url 302 https://www.google.com/$1

# Google.com.hk
^https?:\/\/(?:www\.)?google\.com\.hk\/(.*)$ url 302 https://www.google.com/$1

# Google.com.tw
^https?:\/\/(?:www\.)?google\.com\.tw\/(.*)$ url 302 https://www.google.com/$1

# Google.com.tr
^https?:\/\/(?:www\.)?google\.com\.tr\/(.*)$ url 302 https://www.google.com/$1

# Google.ru
^https?:\/\/(?:www\.)?google\.ru\/(.*)$ url 302 https://www.google.com/$1

[mitm]

hostname = %APPEND% google.cn, *.google.cn, google.co.jp, *.google.co.jp, google.co.uk, *.google.co.uk, google.ca, *.google.ca, google.com.au, *.google.com.au, google.de, *.google.de, google.fr, *.google.fr, google.it, *.google.it, google.es, *.google.es, google.in, *.google.in, google.co.kr, *.google.co.kr, google.com.br, *.google.com.br, google.com.mx, *.google.com.mx, google.com.sg, *.google.com.sg, google.com.hk, *.google.com.hk, google.com.tw, *.google.com.tw, google.com.tr, *.google.com.tr, google.ru, *.google.ru
