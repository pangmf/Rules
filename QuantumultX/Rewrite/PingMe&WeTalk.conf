# ============================================================
# PingMe & WeTalk · 抓取账号参数（签到前置）
# 来源：pangmf/Rules → Loon/Plugin/PingMe&WeTalk.lpx（master 分支）
# 作者：pangmf
# 转换：http-request → script-request-header（原配置未声明 requires-body）
# 原 Loon 用 [Argument] 两个 switch 控制，QuantumultX 无开关机制，这里默认启用
# ============================================================

[rewrite_local]

# > WeTalk 抓包@pangmf
^https:\/\/api\.wetalkapp\.com\/app\/(?:queryBalanceAndBonus|checkIn|videoBonus) url script-request-header https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/WeTalk.js

# > PingMe 抓包@pangmf
^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/PingMe.js

[mitm]

hostname = %APPEND% api.wetalkapp.com, api.pingmeapp.net

# ------------------------------------------------------------
# 定时签到（原 Loon cron 注释状态，此处同样保留）
# 如需启用：移到主配置 [task_local] 段并去掉行首 #
# WeTalk 每天 08:20、20:20
# cron "20 8,20 * * *" script-path=https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/WeTalk.js, tag=WeTalk签到, enabled=true
# PingMe 每天 08:30、20:30
# cron "30 8,20 * * *" script-path=https://raw.githubusercontent.com/pangmf/Rules/refs/heads/master/Loon/task/PingMe.js, tag=PingMe签到, enabled=true
# ------------------------------------------------------------
