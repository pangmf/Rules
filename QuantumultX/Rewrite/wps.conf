# ============================================================
# WPS每日签到 · Cookie 抓取
# 来源：pangmf/Rules → Loon/Plugin/wps.lpx（master 分支）
# 作者：pangmf（脚本 MaYIHEI/paperclip）
# 转换：http-request + requires-body=false → script-request-header
# 触发：打开 WPS App → 进入任务中心/福利中心
# ============================================================

[rewrite_local]

# > WPS Cookie@pangmf
^https:\/\/personal-act\.wps\.cn\/activity-rubik\/activity\/page_info url script-request-header https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.cookie.js

[mitm]

hostname = %APPEND% personal-act.wps.cn

# ------------------------------------------------------------
# 每日 10 点自动签到（原 Loon cron 为注释状态，此处同样保留）
# 如需启用：移到主配置 [task_local] 段并去掉行首 #
# cron "0 10 * * *" script-path=https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/wps/wps.js, tag=WPS签到, enabled=true
# ------------------------------------------------------------
