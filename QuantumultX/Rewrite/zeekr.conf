# ============================================================
# 极氪汽车 · 打开 App 自动获取 Token（签到前置）
# 来源：pangmf/Rules → Loon/Plugin/zeekr.lpx（master 分支）
# 作者：pangmf（脚本 m20104600/zeekr-checkin）
# 转换：http-response + requires-body=true → script-response-body
# 注意：Loon 用 [Argument] 开关控制启用，QuantumultX 无此机制，这里默认启用
# ============================================================

[rewrite_local]

# > 极氪获取Token@pangmf
^https:\/\/api-gw-toc\.zeekrlife\.com\/zeekrlife-app-user\/v\d\/user\/info\/query$ url script-response-body https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js

[mitm]

hostname = %APPEND% api-gw-toc.zeekrlife.com

# ------------------------------------------------------------
# 定时签到（原 Loon cron 注释状态，此处同样保留为注释）
# 如需启用：把下面整行移到主配置的 [task_local] 段，并去掉行首 #
# cron "30 6 * * *" script-path=https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js, tag=极氪自动签到, enabled=true
# ------------------------------------------------------------
